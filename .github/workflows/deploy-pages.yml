name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /tc-travel/
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always ship the latest mistlib engine and wrapper without changing
      # package files. Versions are read from the installed package.json files
      # rather than `npm ls`, which exits non-zero once latest no longer matches
      # the pins in package.json. The type-check in the build step gates
      # deployment: API breaks fail the build and the previous Pages deploy
      # stays live.
      - name: Install latest mistlib
        run: |
          npm install --no-save @tik-choco/mistlib@latest @tik-choco/mistlib-web@latest
          node -e "for (const p of ['@tik-choco/mistlib', '@tik-choco/mistlib-web']) console.log(p, JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version)"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Expose page URL
        id: deployment
        if: always()
        run: |
          url="${{ steps.deployment_1.outputs.page_url }}"
          if [ -z "$url" ]; then url="${{ steps.deployment_2.outputs.page_url }}"; fi
          if [ -z "$url" ]; then url="${{ steps.deployment_3.outputs.page_url }}"; fi
          echo "page_url=$url" >> "$GITHUB_OUTPUT"
